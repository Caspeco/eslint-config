name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  dependabot-automerge:
    uses: Caspeco/github-actions/.github/workflows/dependabot-automerge.yml@v2
    with:
      automerge-level: "minor"
      merge-method: "squash"
    secrets: inherit
